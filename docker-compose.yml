services:
  chatterbox:
    build: .
    ports:
      - "5340:5340"
    environment:
      - PORT=5340
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - DATA_DIR=/data
      - BASE_URL=${BASE_URL:-http://localhost:5340}
    volumes:
      - chatterbox-data:/data
    restart: unless-stopped

volumes:
  chatterbox-data:
